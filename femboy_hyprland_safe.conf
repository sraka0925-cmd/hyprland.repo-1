# femboy_hyprland_safe.conf
# Safe pastel Hyprland config for Arch Linux desktop install.
# Copy this to: ~/.config/hypr/hyprland.conf

# Apps
$mod = SUPER
$terminal = kitty
$launcher = wofi --show drun
$browser = firefox
$files = dolphin

# Monitor
# Default: use preferred resolution/refresh rate, automatic position, scale 1.
monitor = ,preferred,auto,1

# Autostart
# These are normal desktop-session apps. Hyprland itself is still started by your login screen.
exec-once = waybar
exec-once = mako

# Environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1

# Input
input {
    kb_layout = pl
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.45
    }
}

# Cute pastel look
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 3
    col.active_border = rgba(ff8ac7ff) rgba(c9a7ffff) rgba(9bdcffff) 45deg
    col.inactive_border = rgba(5a466baa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.96
    inactive_opacity = 0.88

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(ff8ac755)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = soft, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, soft, popin 88%
    animation = windowsOut, 1, 3, soft, popin 80%
    animation = border, 1, 8, soft
    animation = fade, 1, 4, soft
    animation = workspaces, 1, 4, soft, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

# Window rules
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = center,class:^(pavucontrol)$
windowrulev2 = float,title:^(Picture-in-Picture)$
windowrulev2 = pin,title:^(Picture-in-Picture)$

# Keybinds
bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $launcher
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, exec, pavucontrol

# Focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Audio and brightness
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +8%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 8%-

# Mouse controls
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
