# Mega pastel purple-pink Hyprland config
# Copy this file to: ~/.config/hypr/hyprland.conf

# ---------- Apps ----------
$mod = SUPER
$terminal = kitty
$launcher = wofi --show drun
$browser = firefox
$files = dolphin

# ---------- Monitor ----------
monitor = ,preferred,auto,1

# ---------- Autostart ----------
exec-once = waybar
exec-once = mako
exec-once = swww-daemon

# Add wallpaper later if you have this file:
# exec-once = sleep 1 && swww img ~/Pictures/wallpapers/cute.png --transition-type grow --transition-duration 1

# ---------- Wayland environment ----------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1

# ---------- Input ----------
input {
    kb_layout = pl
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        scroll_factor = 0.45
    }
}

# Three-finger workspace swipe, current Hyprland syntax.
gesture = 3, horizontal, workspace

# ---------- Pastel purple-pink look ----------
general {
    gaps_in = 7
    gaps_out = 16
    border_size = 3
    col.active_border = rgba(ff8ac7ff) rgba(c9a7ffff) rgba(9bdcffff) 40deg
    col.inactive_border = rgba(6d5a85aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 18
    active_opacity = 0.97
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(ff8ac755)
        color_inactive = rgba(241b3055)
    }

    blur {
        enabled = true
        size = 7
        passes = 2
        ignore_opacity = true
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = cute, 0.16, 1, 0.3, 1
    bezier = soft, 0.22, 0.9, 0.28, 1.05
    animation = windows, 1, 4, cute, popin 88%
    animation = windowsOut, 1, 3, cute, popin 80%
    animation = border, 1, 8, soft
    animation = borderangle, 1, 8, soft
    animation = fade, 1, 4, cute
    animation = workspaces, 1, 4, cute, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---------- Window rules ----------
windowrule = float on, match:class pavucontrol
windowrule = center on, match:class pavucontrol
windowrule = size 900 600, match:class pavucontrol
windowrule = float on, match:title Picture-in-Picture
windowrule = pin on, match:title Picture-in-Picture
windowrule = opacity 0.94 0.86, match:class kitty
windowrule = opacity 0.96 0.88, match:class wofi

# ---------- Keybinds ----------
bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $launcher
bind = $mod, R, exec, $launcher
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod, P, exec, pavucontrol
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, T, pseudo
bind = $mod SHIFT, C, exec, hyprctl reload

# Focus windows
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Resize windows
binde = $mod CTRL, H, resizeactive, -30 0
binde = $mod CTRL, L, resizeactive, 30 0
binde = $mod CTRL, K, resizeactive, 0 -30
binde = $mod CTRL, J, resizeactive, 0 30

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/shot-$(date +%Y%m%d-%H%M%S).png

# Audio, brightness, media
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +8%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 8%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Mouse controls
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
