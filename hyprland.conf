# ░▒▓ HYPRLAND CONFIG (.conf / legacy hyprlang) — Lavender Noir ▓▒░
# vibe: pastel purple + soft neon glow (femboy x Blade Runner 2049)

monitor=,preferred,auto,1

# ────────────── Autostart ──────────────
exec-once = waybar
exec-once = hyprpaper
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# ────────────── Environment ──────────────
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

# ────────────── Input ──────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ────────────── General ──────────────
general {
    gaps_in = 6
    gaps_out = 16
    border_size = 2
    # gradient: pastel purple -> soft pink (Blade Runner glow)
    col.active_border = rgba(c9a7ffee) rgba(f5b8d0ee) 45deg
    col.inactive_border = rgba(8a7ca655)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ────────────── Decoration — rounding, blur, shadows ──────────────
decoration {
    rounding = 20

    active_opacity = 0.97
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.02
        contrast = 1.0
        brightness = 1.05
        vibrancy = 0.25
        popups = true
    }

    # soft purple shadows, gently diffused
    shadow {
        enabled = true
        range = 32
        render_power = 3
        color = rgba(b794f675)
        color_inactive = rgba(8a7ca635)
        offset = 0 8
    }
}

# ────────────── Animations — smooth and gentle ──────────────
animations {
    enabled = true

    bezier = softPurple, 0.16, 1, 0.3, 1
    bezier = gentle, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 5, softPurple, popin 85%
    animation = windowsOut, 1, 5, gentle, popin 85%
    animation = border, 1, 8, gentle
    animation = borderangle, 1, 30, gentle, loop
    animation = fade, 1, 5, gentle
    animation = workspaces, 1, 5, softPurple, slidefade 15%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(1a1625)
}

# ────────────── Window rules — float everything ──────────────
windowrulev2 = float, class:.*
windowrulev2 = center, class:.*
windowrulev2 = size 62% 68%, class:.*

windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 25% 25%, title:^(Picture-in-Picture)$

# ────────────── Keybindings ──────────────
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, P, pseudo
bind = $mainMod, F, fullscreen

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
